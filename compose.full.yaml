# Full mode: every app runs with its debugger on. Storybooks, if any, keep their lean command.
# Every app calls its program directly, as in compose.yaml.
# KEEP IN STEP: each command here is also the app's `dev:full` script in its
# package.json; change both in the same commit. The scripts differ on purpose: the
# debugger listens on 127.0.0.1 there, and a Go app's script sets PORT itself.
# Debugger ports are not published: attach from the editing service, by service name.
# Environment entries here are merged with compose.yaml's, by name.
# Start with: docker compose -f compose.yaml -f compose.full.yaml up -d
# Back to lean: docker compose up -d

services:
  api:
    # -xdir tmp and generated: see compose.yaml. Optimisations off so the debugger sees every variable.
    command:
      [
        "wgo",
        "-xdir",
        "tmp",
        "-xdir",
        "generated",
        "go",
        "build",
        "-gcflags=all=-N -l",
        "-o",
        "./tmp/api",
        "./cmd/api",
        "::",
        "dlv",
        "exec",
        "./tmp/api",
        "--headless",
        "--listen=:2345",
        "--api-version=2",
        "--accept-multiclient",
        "--continue",
      ]
