# Runs inside the editing service, where every toolchain is.
#
# pre-commit: fast, staged files only, tools called directly (no turbo).
# Fixers write to the same files, so they run one after another:
# lint fix, then format (format has the last word).
pre-commit:
  parallel: false
  commands:
    9-prettier:
      glob: "*.{js,ts,svelte,json,css,md,yml,yaml,html}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

# pre-push: check only, nothing is modified (fixes made at push time would not
# be part of the pushed commits). Package checks go through turbo, so results are
# cached and shared with manual runs. No tests: they run in CI.
pre-push:
  parallel: true
  commands:
    turbo-checks:
      run: pnpm turbo run lint:check format:check typecheck
    # turbo only sees packages; this covers files at the repo root.
    format-root:
      run: pnpm run format:root:check
