name: hello-016

# The source of truth for every toolchain version. Exact versions only.
#
# These names are a contract: do not rename or remove one without changing every
# reader in the same commit. A new one is added here first, with its readers.
#   NODE_VERSION        Dockerfile.all, Dockerfile.node, scripts/check-versions.sh, scripts/update-node-types.sh
#   OS_RELEASE          Dockerfile.all, Dockerfile.node, scripts/check-versions.sh
#   PNPM_VERSION        Dockerfile.all, Dockerfile.node, scripts/check-versions.sh, scripts/update-pnpm-version.sh
#   PLAYWRIGHT_VERSION  Dockerfile.all. It only picks Chromium's system libraries for OS_RELEASE:
#                       change it together with OS_RELEASE, not with the catalog's Playwright.
#   CACHE_DIR           Dockerfile.all
x-versions-args: &versions-args
  NODE_VERSION: 24.22.1
  OS_RELEASE: trixie
  PNPM_VERSION: 12.16.0
  PLAYWRIGHT_VERSION: 1.64.1
  CACHE_DIR: /monorepo/.cache

x-service-defaults: &service-defaults
  init: true
  volumes:
    - ./:/monorepo
  depends_on:
    maintenance:
      condition: service_healthy

x-build-defaults: &build-defaults
  context: ./
  args:
    <<: *versions-args

services:
  # --- working services ---------------

  # Where the work is done: the editor attaches here, and git, the hooks, manual turbo
  # runs, end-to-end tests and the debuggers' clients all run here. Has every toolchain,
  # runs nothing, and waits for nothing, so it can be used even when `maintenance` fails.
  editing:
    <<: *service-defaults
    working_dir: /monorepo
    build:
      dockerfile: ./Dockerfile.all
      <<: *build-defaults
    depends_on: {}
    environment:
      # Where the end-to-end tests find each frontend app (by service name).
      - WEB_URL=http://web:5173
    command: ["sleep", "infinity"]

  # Prepares what the other services need, then keeps it up to date:
  #   1. installs the dependencies (frozen lockfile: CI=true), and what the apps' tools
  #      need beside them (the Go tools, the test browser into .cache/playwright)
  #   2. generates code once (every package with a `generate` script)
  #   3. marks itself ready: the app services wait for this (see the healthcheck)
  #   4. stays alive, regenerating when a package with a `generate` script changes
  maintenance:
    <<: *service-defaults
    working_dir: /monorepo
    build:
      dockerfile: ./Dockerfile.all
      <<: *build-defaults
    depends_on: {}
    environment:
      # pnpm would otherwise wait for a terminal to ask in; this service has none.
      - CI=true
    # The marker is removed first: a container that is stopped and started keeps its
    # files, and must not look ready before the steps above have run again.
    command:
      [
        "sh",
        "-c",
        "rm -f /tmp/ready && pnpm install && pnpm --filter web-e2e exec playwright install --only-shell chromium && pnpm turbo run generate && touch /tmp/ready && exec pnpm turbo watch generate",
      ]
    # Healthy once the marker exists. Checked every second while starting, so the
    # app services start as soon as step 3 is reached.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      start_period: 10m
      start_interval: 1s
      interval: 30s
      timeout: 2s

  # --- app services --------------------

  # Every app service calls its program directly, with no wrapper process kept alive
  # (no shell, no `pnpm run`). Where the programs come from:
  #   - JS programs: the package's node_modules/.bin
  #
  # KEEP IN STEP: each of these commands is also written as a package.json script, for
  # running the repo on the host without Docker. Whenever one changes, change the other
  # in the same commit:
  #   - an app's command: its `dev:lean` script; its full-mode command (compose.full.yaml):
  #     its `dev:full` script
  #   - a Storybook's command: its package's `storybook:dev` script
  # Intended differences:
  #   - in `dev:full`, the debuggers listen on 127.0.0.1 only: 0.0.0.0 would open them to
  #     the local network
  #   - in `dev:full`, the JS apps' debuggers take a random port (`--inspect=0`): on one
  #     host, a fixed port would clash between JS apps

  # Host, port and allowed hosts are in vite.config.ts (every interface; `web` for
  # the end-to-end tests, which call it by service name).
  web:
    <<: *service-defaults
    working_dir: /monorepo/apps/web
    build:
      dockerfile: ./Dockerfile.node
      <<: *build-defaults
    ports:
      - "5173:5173"
    command: ["./node_modules/.bin/vite", "dev"]

  # Storybook listens on 127.0.0.1 unless told otherwise; --exact-port fails instead
  # of moving to another port. It runs the app's Vite config, so it gets every variable
  # the app gets, the same as `web` (see `editing`): without them, starting
  # Storybook breaks the running app.
  web-storybook:
    <<: *service-defaults
    working_dir: /monorepo/apps/web
    build:
      dockerfile: ./Dockerfile.node
      <<: *build-defaults
    ports:
      - "6007:6007"
    command:
      [
        "./node_modules/.bin/storybook",
        "dev",
        "-p",
        "6007",
        "--host",
        "0.0.0.0",
        "--exact-port",
        "--no-open",
      ]
