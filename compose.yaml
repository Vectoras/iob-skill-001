name: hello-015

# The source of truth for every toolchain version. Exact versions only.
#
# These names are a contract: do not rename or remove one without changing every
# reader in the same commit. A new one is added here first, with its readers.
#   NODE_VERSION        Dockerfile.all, Dockerfile.node, scripts/check-versions.sh, scripts/update-node-types.sh
#   OS_RELEASE          Dockerfile.all, Dockerfile.go, Dockerfile.node, scripts/check-versions.sh
#   PNPM_VERSION        Dockerfile.all, Dockerfile.node, scripts/check-versions.sh, scripts/update-pnpm-version.sh
#   GO_VERSION          Dockerfile.all, Dockerfile.go, scripts/check-versions.sh, scripts/update-go-version.sh
#   GOLANGCI_VERSION    Dockerfile.all, scripts/check-versions.sh
#   PLAYWRIGHT_VERSION  Dockerfile.all. It only picks Chromium's system libraries for OS_RELEASE:
#                       change it together with OS_RELEASE, not with the catalog's Playwright.
#   CACHE_DIR           Dockerfile.all, Dockerfile.go
x-versions-args: &versions-args
  NODE_VERSION: 24.22.1
  OS_RELEASE: trixie
  PNPM_VERSION: 12.15.0
  GO_VERSION: 1.27.3
  GOLANGCI_VERSION: 2.15.0
  PLAYWRIGHT_VERSION: 1.64.1
  CACHE_DIR: /monorepo/.cache

x-service-defaults: &service-defaults
  init: true
  volumes:
    - ./:/monorepo
  depends_on:
    maintenance:
      condition: service_healthy

x-build-defaults: &build-defaults
  context: ./
  args:
    <<: *versions-args

services:
  # --- working services ---------------

  # Where the work is done: the editor attaches here, and git, the hooks, manual turbo
  # runs, end-to-end tests and the debuggers' clients all run here. Has every toolchain,
  # runs nothing, and waits for nothing, so it can be used even when `maintenance` fails.
  editing:
    <<: *service-defaults
    working_dir: /monorepo
    build:
      dockerfile: ./Dockerfile.all
      <<: *build-defaults
    depends_on: {}
    environment:
      # Each frontend app's variables, for its tests run here: every process that runs an app's code gets the app's variables (docs/guide.md §3). SvelteKit writes the values of src/env.ts's variables into .svelte-kit/generated/dev/env/, shared by every process that runs the app's Vite config (the app, its Storybook, its tests); one run without them overwrites it, and the running app then fails every request with env_invalid. Secrets: SvelteKit reads the app's .env itself. Keep these the same as the apps'.
      - ACCOUNTS_URL=http://accounts:8080
      - ORDERS_URL=http://orders:8081
      # Where the end-to-end tests find each frontend app (by service name).
      - SHOP_URL=http://shop:5173
    command: ["sleep", "infinity"]

  # Prepares what the other services need, then keeps it up to date:
  #   1. installs the dependencies (frozen lockfile: CI=true), and what the apps' tools
  #      need beside them (the Go tools, the test browser into .cache/playwright)
  #   2. generates code once (every package with a `generate` script)
  #   3. marks itself ready: the app services wait for this (see the healthcheck)
  #   4. stays alive, regenerating when a package with a `generate` script changes
  maintenance:
    <<: *service-defaults
    working_dir: /monorepo
    build:
      dockerfile: ./Dockerfile.all
      <<: *build-defaults
    depends_on: {}
    environment:
      # pnpm would otherwise wait for a terminal to ask in; this service has none.
      - CI=true
    # The marker is removed first: a container that is stopped and started keeps its
    # files, and must not look ready before the steps above have run again.
    command:
      [
        "sh",
        "-c",
        "rm -f /tmp/ready && pnpm install && GOWORK=off go -C tools install tool && pnpm --filter shop-e2e exec playwright install --only-shell chromium && pnpm turbo run generate && touch /tmp/ready && exec pnpm turbo watch generate",
      ]
    # Healthy once the marker exists. Checked every second while starting, so the
    # app services start as soon as step 3 is reached.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      start_period: 10m
      start_interval: 1s
      interval: 30s
      timeout: 2s

  # --- app services --------------------

  # Every app service calls its program directly, with no wrapper process kept alive
  # (no shell, no `go tool`, no `pnpm run`): Go tools from $GOPATH/bin, filled by
  # `maintenance` from the tools module (tools/); JS programs from the package's
  # node_modules/.bin.
  #
  # KEEP IN STEP: each app's command here is also written as the `dev:lean` script in
  # the app's package.json (and its full-mode command, in compose.full.yaml, as
  # `dev:full`); each Storybook's command is also its package's `storybook:dev` script.
  # Those scripts are for running the repo on the host without Docker. Whenever a
  # command changes in one place, change it in the other in the same commit. Intended
  # differences:
  #   - in `dev:full`, the debuggers listen on 127.0.0.1 only, and the JS apps on a random
  #     port (`--inspect=0`): on one host, a fixed port would clash between JS apps,
  #     and 0.0.0.0 would open the debuggers to the local network
  #   - a Go app's scripts start with `PORT=<port>`, which a service sets in its
  #     `environment`: on one host, every app would otherwise inherit the same PORT

  # -xdir tmp: the build writes into tmp/, inside the watched folder. Without the
  # exclusion the build would trigger the watcher and the server would start twice.
  accounts:
    <<: *service-defaults
    working_dir: /monorepo/apps/accounts
    build:
      dockerfile: ./Dockerfile.go
      <<: *build-defaults
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    # Secrets (ACCOUNTS_SECRET). Copy .env.example to .env in a fresh clone.
    env_file: apps/accounts/.env
    command:
      [
        "wgo",
        "-xdir",
        "tmp",
        "go",
        "build",
        "-o",
        "./tmp/accounts",
        "./cmd/accounts",
        "::",
        "./tmp/accounts",
      ]

  # -xdir tmp: the build writes into tmp/, inside the watched folder. Without the
  # exclusion the build would trigger the watcher and the server would start twice.
  orders:
    <<: *service-defaults
    working_dir: /monorepo/apps/orders
    build:
      dockerfile: ./Dockerfile.go
      <<: *build-defaults
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    # Secrets (ORDERS_SECRET). Copy .env.example to .env in a fresh clone.
    env_file: apps/orders/.env
    command:
      [
        "wgo",
        "-xdir",
        "tmp",
        "go",
        "build",
        "-o",
        "./tmp/orders",
        "./cmd/orders",
        "::",
        "./tmp/orders",
      ]

  ui-components-storybook:
    <<: *service-defaults
    working_dir: /monorepo/packages/ui-components
    build:
      dockerfile: ./Dockerfile.node
      <<: *build-defaults
    ports:
      - "6006:6006"
    command:
      [
        "./node_modules/.bin/storybook",
        "dev",
        "-p",
        "6006",
        "--host",
        "0.0.0.0",
        "--exact-port",
        "--no-open",
      ]

  # Host, port and allowed hosts are in vite.config.ts (every interface; `shop` for
  # the end-to-end tests, which call it by service name).
  shop:
    <<: *service-defaults
    working_dir: /monorepo/apps/shop
    build:
      dockerfile: ./Dockerfile.node
      <<: *build-defaults
    ports:
      - "5173:5173"
    environment:
      - ACCOUNTS_URL=http://accounts:8080
      - ORDERS_URL=http://orders:8081
    env_file: apps/shop/.env
    command: ["./node_modules/.bin/vite", "dev"]

  # Storybook listens on 127.0.0.1 unless told otherwise; --exact-port fails instead
  # of moving to another port. It runs the app's Vite config, so it gets the app's
  # variables, the same as `shop` (see `editing`): without them, starting Storybook
  # breaks the running app.
  shop-storybook:
    <<: *service-defaults
    working_dir: /monorepo/apps/shop
    build:
      dockerfile: ./Dockerfile.node
      <<: *build-defaults
    ports:
      - "6007:6007"
    environment:
      - ACCOUNTS_URL=http://accounts:8080
      - ORDERS_URL=http://orders:8081
    env_file: apps/shop/.env
    command:
      [
        "./node_modules/.bin/storybook",
        "dev",
        "-p",
        "6007",
        "--host",
        "0.0.0.0",
        "--exact-port",
        "--no-open",
      ]
